[module/dot]
type = custom/text
format = 
format-background = ${color.BACKGROUND}
format-foreground = ${color.ALTBACKGROUND}
format-padding = 2

[module/LD]
type = custom/text
format = "%{T3}%{T-}"
format-background = ${color.BACKGROUND}
format-foreground = ${color.ALTBACKGROUND}

[module/RD]
type = custom/text
format = "%{T3}%{T-}"
format-background = ${color.BACKGROUND}
format-foreground = ${color.ALTBACKGROUND}

[module/menu]
type = custom/text
format = 
format-font = 2
format-foreground = ${color.YELLOW}
format-padding = 0
click-left = "rofi -show drun -theme ~/.config/rofi/theme.rasi"
click-right = "rofi -show run -theme ~/.config/rofi/theme.rasi"
