[module/i3]
type = internal/i3
pin-workspaces = true
enable-scroll = true
wrapping-scroll = false
index-sort = true
strip-wsnumbers = true
ws-icon-0 = 1;󰖟
ws-icon-1 = 2;󰅴
ws-icon-2 = 3;󰆍
ws-icon-3 = 4;󰉋
ws-icon-4 = 5;󰊗
ws-icon-5 = 6;󰓓
ws-icon-6 = 7;󰊌
ws-icon-7 = 8;󰒓
ws-icon-default = 󰧟
; thin space (U+2009, drawn with font-3) between number and icon
format = <label-state> <label-mode>
format-background = ${color.ALTBACKGROUND}
label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${color.YELLOW}
label-mode-foreground = ${color.BACKGROUND}
label-focused = %index% %icon%
label-focused-foreground = ${color.BACKGROUND}
label-focused-background = ${color.ACCENT}
label-focused-padding-left = 11px
label-focused-padding-right = 2
label-unfocused = %index% %icon%
label-unfocused-foreground = ${color.WHITE}
label-unfocused-background = ${color.ALTBACKGROUND}
label-unfocused-padding-left = 11px
label-unfocused-padding-right = 2
label-visible = %index% %icon%
label-visible-background = ${color.ALTBACKGROUND}
label-visible-underline = ${color.ALTBLACK}
label-visible-padding-left = 11px
label-visible-padding-right = 2
label-urgent = %index% %icon%
label-urgent-foreground = ${color.BACKGROUND}
label-urgent-background = ${color.RED}
label-urgent-padding-left = 11px
label-urgent-padding-right = 2

[module/title]
type = internal/xwindow
format = <label>
format-background = ${color.ALTBACKGROUND}
format-foreground = ${color.WHITE}
format-padding = 4
label = %title%
label-maxlen = 50
label-empty = Desktop
label-empty-foreground = ${color.ALTFOREGROUND}

[module/network]
type = internal/network
interface-type = wired
interval = 3.0
accumulate-stats = true
unknown-as-up = true
speed-unit = B/s
format-connected = <label-connected>
; this module has no plain "format": the background must be set per state
format-connected-background = ${color.ALTBACKGROUND}
format-disconnected-background = ${color.ALTBACKGROUND}
format-disconnected = <label-disconnected>
format-disconnected-prefix = "睊 "
format-disconnected-font = 1
format-disconnected-foreground = ${color.ALTFOREGROUND}
label-connected = ${generated.network}
label-connected-font = 1
label-connected-foreground = ${color.ALTWHITE}
label-disconnected = not connected
label-disconnected-foreground = ${color.ALTWHITE}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${color.ALTBACKGROUND}
format-prefix = "󰘚 "
format-prefix-font = 1
format-prefix-foreground = ${color.BLUE}
format-prefix-padding-left = 4px
format-prefix-padding-right = 4px
label = "%{A1:alacritty --class alacritty-float,alacritty-float -e btop --force-utf:}%{A3:alacritty --class alacritty-float,alacritty-float -e btop --force-utf:}%percentage:2%%%{A}%{A}"

[module/cpu-temp]
type = custom/script
exec = ~/.config/polybar/scripts/temp cpu
interval = 5
format = <label>
format-prefix = "󰔏 "
format-prefix-font = 1
format-prefix-foreground = ${color.RED}
format-prefix-padding-left = 8px
format-prefix-padding-right = 4px
format-background = ${color.ALTBACKGROUND}
label = %output%
click-left = alacritty --class alacritty-float,alacritty-float -e btop --force-utf
click-right = alacritty --class alacritty-float,alacritty-float -e btop --force-utf

[module/gpu-temp]
type = custom/script
exec = ~/.config/polybar/scripts/temp gpu
interval = 5
format = <label>
format-prefix = "󰢮 "
format-prefix-font = 1
format-prefix-foreground = ${color.MAGENTA}
format-prefix-padding-left = 8px
format-prefix-padding-right = 4px
format-background = ${color.ALTBACKGROUND}
format-padding-right = 4px
label = %output%
click-left = alacritty --class alacritty-float,alacritty-float -e btop --force-utf
click-right = alacritty --class alacritty-float,alacritty-float -e btop --force-utf

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-background = ${color.ALTBACKGROUND}
format-padding-right = 4px
format-prefix = "󰍛 "
format-prefix-font = 1
format-prefix-foreground = ${color.GREEN}
format-prefix-padding-left = 4px
format-prefix-padding-right = 4px
label = "%{A1:alacritty --class alacritty-float,alacritty-float -e btop --force-utf:}%{A3:alacritty --class alacritty-float,alacritty-float -e btop --force-utf:}%gb_used%%{A}%{A}"
warn-percentage = 85
format-warn = <label-warn>
format-warn-background = ${color.ALTBACKGROUND}
format-warn-padding-right = 4px
format-warn-prefix = ${self.format-prefix}
format-warn-prefix-font = 1
format-warn-prefix-foreground = ${color.RED}
format-warn-prefix-padding-left = 4px
format-warn-prefix-padding-right = 4px
label-warn = "%{A1:alacritty --class alacritty-float,alacritty-float -e btop --force-utf:}%{A3:alacritty --class alacritty-float,alacritty-float -e btop --force-utf:}%gb_used%%{A}%{A}"
label-warn-foreground = ${color.RED}

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
; left click mutes, scroll changes volume, right click opens the mixer
click-right = pavucontrol
format-volume = <ramp-volume><label-volume>
format-volume-background = ${color.ALTBACKGROUND}
format-volume-padding = 1
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-background = ${color.ALTBACKGROUND}
format-muted-padding = 1
format-muted-prefix = "󰖁 "
format-muted-prefix-font = 1
format-muted-prefix-padding-left = 4px
format-muted-prefix-padding-right = 4px
label-muted = Muted
label-muted-foreground = ${color.ALTFOREGROUND}
ramp-volume-0 = "󰕿 "
ramp-volume-1 = "󰖀 "
ramp-volume-2 = "󰕾 "
ramp-volume-font = 1
ramp-volume-padding-right = 4px
ramp-volume-foreground = ${color.YELLOW}

[module/date]
type = internal/date
interval = 5
date = %a %d
time = %I:%M %p
date-alt = %A, %d %B %Y
time-alt = %I:%M:%S %p
format = <label>
format-background = ${color.ALTBACKGROUND}
format-padding-right = 4px
format-prefix = "󰅐 "
format-prefix-font = 1
format-prefix-foreground = ${color.CYAN}
format-prefix-padding-left = 4px
format-prefix-padding-right = 4px
label = %{A3:gsimplecal:}%date%  %time%%{A}
label-foreground = ${color.ALTWHITE}

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 8px
tray-size = 65%

[module/pomo]
type = custom/script
exec = ~/.config/polybar/scripts/pomo
tail = true
format = <label>
format-background = ${color.ALTBACKGROUND}
click-left = ~/.config/polybar/scripts/pomo start
click-middle = ~/.config/polybar/scripts/pomo stop
click-right = ~/.config/polybar/scripts/pomo toggle_pause
label = %output%
label-padding = 1

[module/brightness]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/brightness get
initial = 1
format = <output>
format-prefix = "󰃟 "
format-prefix-font = 1
format-prefix-foreground = ${color.YELLOW}
format-background = ${color.ALTBACKGROUND}
format-padding = 1
; scroll steps 5%, left click picks a preset, right click flips day/night
click-left = ~/.config/polybar/scripts/brightness menu
click-right = ~/.config/polybar/scripts/brightness toggle
scroll-up = ~/.config/polybar/scripts/brightness up
scroll-down = ~/.config/polybar/scripts/brightness down

[module/mic]
type = custom/script
exec = ~/.config/polybar/scripts/mic
tail = true
format = <label>
format-background = ${color.ALTBACKGROUND}
format-padding = 1
label = %output%
; left click mutes/unmutes the mic, right click opens the input devices tab
click-left = ~/.config/polybar/scripts/mic toggle
click-right = pavucontrol -t 4

[module/caps]
type = internal/xkeyboard
; nothing while off; a red badge while Caps Lock is on. Click turns it off.
format = <label-indicator>
format-background = ${color.ALTBACKGROUND}
indicator-icon-0 = caps lock;;CAPS
label-indicator-on-capslock = %{A1:xdotool key Caps_Lock:} CAPS %{A}
label-indicator-on-capslock-foreground = ${color.BACKGROUND}
label-indicator-on-capslock-background = ${color.RED}
label-indicator-off-capslock =
label-indicator-on-numlock =
label-indicator-on-scrolllock =
