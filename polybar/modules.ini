[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
strip-wsnumbers = true
format = <label-state> <label-mode>
format-background = ${color.ALTBACKGROUND}
label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${color.YELLOW}
label-mode-foreground = ${color.BACKGROUND}
label-focused = %index%
label-focused-foreground = ${color.BACKGROUND}
label-focused-background = ${color.BLUE}
label-focused-underline = ${color.YELLOW}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${color.FOREGROUND}
label-unfocused-background = ${color.ALTBACKGROUND}
label-unfocused-padding = 2
label-visible = %index%
label-visible-background = ${color.ALTBACKGROUND}
label-visible-underline = #555555
label-visible-padding = 2
label-urgent = %index%
label-urgent-foreground = ${color.BACKGROUND}
label-urgent-background = ${color.RED}
label-urgent-padding = 2

[module/title]
type = internal/xwindow
format = <label>
format-background = ${color.ALTBACKGROUND}
format-foreground = ${color.WHITE}
format-padding = 4
label = %title%
label-maxlen = 50
label-empty = Desktop
label-empty-foreground = #707880

[module/network]
type = internal/network
interface-type = wired
interval = 3.0
accumulate-stats = true
unknown-as-up = true
speed-unit = B/s
format-connected = <label-connected>
format-background = ${color.ALTBACKGROUND}
format-disconnected = <label-disconnected>
format-disconnected-prefix = "睊 "
format-disconnected-font = 1
format-disconnected-foreground = ${color.ALTFOREGROUND}
label-connected = %{A1:nm-connection-editor:} 󰁆 %downspeed% 󰁞 %upspeed%%{A}
label-connected-font = 1
label-connected-foreground = ${color.ALTWHITE}
label-disconnected = not connected
label-disconnected-foreground = ${color.ALTWHITE}

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
format-background = ${color.ALTBACKGROUND}
format-prefix = " "
format-prefix-font = 1
format-prefix-foreground = ${color.BLUE}
format-prefix-padding = 1
label = "%percentage:2%%"

[module/cpu-temp]
type = custom/script
exec = ~/.config/polybar/scripts/get-formatted-temp.sh cpu
interval = 5
format = <label>
format-prefix = " "
format-prefix-font = 1
format-prefix-foreground = ${color.RED}
format-prefix-padding = 1
format-background = ${color.ALTBACKGROUND}
label = %output%

[module/gpu-temp]
type = custom/script
exec = ~/.config/polybar/scripts/get-formatted-temp.sh gpu
interval = 5
format = <label>
format-prefix = "󰢮 "
format-prefix-font = 1
format-prefix-foreground = ${color.MAGENTA}
format-prefix-padding = 1
format-background = ${color.ALTBACKGROUND}
label = %output%

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-background = ${color.ALTBACKGROUND}
format-prefix = " "
format-prefix-font = 1
format-prefix-foreground = ${color.GREEN}
format-prefix-padding = 1
label = "%mb_used%MB"

[module/volume]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume>%{O4}<label-volume>
format-volume-background = ${color.ALTBACKGROUND}
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-background = ${color.ALTBACKGROUND}
format-muted-prefix = " "
format-muted-prefix-font = 1
format-muted-prefix-padding = 1
label-muted = Muted
label-muted-foreground = ${color.ALTFOREGROUND}
ramp-volume-0 = " "
ramp-volume-1 = " "
ramp-volume-2 = " "
ramp-volume-font = 1
ramp-volume-foreground = ${color.YELLOW}

[module/date]
type = internal/date
interval = 1.0
time = %I:%M %p
time-alt = %A, %b %d
format = <label>
format-background = ${color.ALTBACKGROUND}
format-prefix = " "
format-prefix-font = 1
format-prefix-foreground = ${color.CYAN}
format-prefix-padding = 1
label = %time%
label-foreground = ${color.ALTWHITE}

[module/tray]
type = internal/tray
format = <tray>
format-background = ${color.ALTBACKGROUND}
tray-spacing = 8px
tray-size = 65%
