[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ./colors.ini
include-file = ./decor.ini
include-file = ./modules.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 26

background = ${color.BACKGROUND}
foreground = ${color.FOREGROUND}

radius-top = 0.0
radius-bottom = 0.0

line-size = 2
line-color = ${color.ACCENT}

border-size = 6
border-color = ${color.BACKGROUND}

padding = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrains Mono Nerd Font:style=Bold:size=11;2"
font-1 = "Noto Sans Mono:style=Bold:size=11;2"
; pill caps (%{T3}). A monospace font squeezes the half-circle glyph into one
; cell, which makes a tall half-ellipse; the matrix stretches it 1.9x sideways
; into a true half-circle.
font-2 = "JetBrains Mono Nerd Font:style=Bold:size=18:matrix=1.9 0 0 1;5"

modules-left = menu dot LD i3 RD dot LD network RD dot LD pomo RD
modules-center = LD date RD
modules-right = LD cpu cpu-temp gpu-temp RD dot LD memory RD dot LD brightness volume mic caps RD dot tray

separator =
spacing = 0

dim-value = 1.0
wm-name = i3

enable-ipc = true
screenchange-reload = true

compositing-background = inherit
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
