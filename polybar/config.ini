[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ./colors.ini
include-file = ./decor.ini
include-file = ./modules.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 26

background = ${color.BACKGROUND}
foreground = ${color.FOREGROUND}

radius-top = 0.0
radius-bottom = 0.0

line-size = 2
line-color = ${color.ACCENT}

border-size = 6
border-color = ${color.BACKGROUND}

padding = 1
module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrains Mono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrains Mono:style=Bold:size=11;2"
font-2 = "JetBrains Mono Nerd Font:style=Bold:size=18;5"

modules-left = menu dot LD i3 RD dot tray dot network
modules-center = LD date RD
modules-right = LD pomo RD dot LD cpu cpu-temp gpu-temp RD dot LD memory RD dot LD brightness volume  RD

separator =
spacing = 0

dim-value = 1.0
wm-name = i3

enable-ipc = true
screenchange-reload = true

compositing-background = inherit
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
