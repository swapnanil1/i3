# Applies only when the kernel driver is amdgpu; needs xf86-video-amdgpu.
# VariableRefresh = FreeSync for fullscreen windows (picom unredirects them).
Section "OutputClass"
	Identifier "AMD Radeon"
	MatchDriver "amdgpu"
	Driver "amdgpu"
	Option "TearFree" "true"
	Option "VariableRefresh" "true"
EndSection
