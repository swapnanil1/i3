[env]
TERM = "alacritty"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 82, lines = 24 }
padding = { x = 10, y = 10 }
dynamic_title = true
decorations = "full"
opacity = 0.9
blur = true
decorations_theme_variant = "None"

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 13.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[colors]
[colors.primary]
background = '#1e222a'
foreground = '#c8ccd4'

[colors.cursor]
text = '#1e222a'
cursor = '#c8ccd4'

[colors.vi_mode_cursor]
text = '#1e222a'
cursor = '#c8ccd4'

[colors.search]
matches = { foreground = '#1e222a', background = '#d19a66' }
focused_match = { foreground = '#1e222a', background = '#61afef' }

[colors.hints]
start = { foreground = '#1e222a', background = '#e5c07b' }
end = { foreground = '#1e222a', background = '#abb2bf' }

[colors.selection]
text = '#c8ccd4'
background = '#3e4451'

[colors.normal]
black =   '#1e222a'
red =     '#e06c75'
green =   '#98c379'
yellow =  '#e5c07b'
blue =    '#61afef'
magenta = '#c678dd'
cyan =    '#56b6c2'
white =   '#abb2bf'

[colors.bright]
black =   '#545862'
red =     '#e06c75'
green =   '#98c379'
yellow =  '#e5c07b'
blue =    '#61afef'
magenta = '#c678dd'
cyan =    '#56b6c2'
white =   '#c8ccd4'

[bell]
animation = "EaseOutExpo"
duration = 200
color = '#c8ccd4'
command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/dialog-error.oga"] }

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 750
blink_timeout = 5
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩‘]+"
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "U", mods = "Control|Shift" }

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "None"
print_events = false
highlight_damage = false
prefer_egl = false
