## Theme

##-- Variables -----------------------------

set $i3_fonts JetBrainsMono Nerd Font 13

set $i3_border_size 2
set $i3_border_style pixel

set $i3_gaps_inner 10
set $i3_gaps_outer 0
# on: a lone window fills the screen, gaps appear once there are two
set $i3_gaps_smart on

set $i3_cl_col_bg #1e222a
set $i3_cl_col_fg #c8ccd4
set $i3_cl_col_afoc #da6e89
set $i3_cl_col_ufoc #292e39
set $i3_cl_col_urgt #c678dd
set $i3_cl_col_phol #1e222a

##-- Font ----------------------------------

font pango:$i3_fonts

##-- Borders -------------------------------

default_border $i3_border_style $i3_border_size
default_floating_border $i3_border_style $i3_border_size

## Client-side-decorated apps (GTK headerbars) ask for no border through motif
## hints, which leaves them without a focus colour. Force it on everything.
for_window [all] border $i3_border_style $i3_border_size

## No border either when a window is alone on its workspace
hide_edge_borders smart_no_gaps

##-- Gaps ----------------------------------

gaps inner $i3_gaps_inner
gaps outer $i3_gaps_outer
smart_gaps $i3_gaps_smart

##-- Colors --------------------------------

## Only the focused window is bright. The indicator (split direction hint)
## matches its border: autotiling picks the direction, so it needs no emphasis.
# class                  border            backgr.           text            indicator         child_border
client.focused           $i3_cl_col_afoc   $i3_cl_col_afoc   $i3_cl_col_bg   $i3_cl_col_afoc   $i3_cl_col_afoc
client.focused_inactive  $i3_cl_col_ufoc   $i3_cl_col_ufoc   $i3_cl_col_fg   $i3_cl_col_ufoc   $i3_cl_col_ufoc
client.unfocused         $i3_cl_col_ufoc   $i3_cl_col_ufoc   $i3_cl_col_fg   $i3_cl_col_ufoc   $i3_cl_col_ufoc
client.urgent            $i3_cl_col_urgt   $i3_cl_col_urgt   $i3_cl_col_fg   $i3_cl_col_urgt   $i3_cl_col_urgt
client.placeholder       $i3_cl_col_phol   $i3_cl_col_phol   $i3_cl_col_fg   $i3_cl_col_phol   $i3_cl_col_phol
client.background        $i3_cl_col_bg
