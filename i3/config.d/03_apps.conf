## Apps and hardware keys
##
##   A line starting with "#:" describes the binding below it; the Keys list
##   (Mod+Shift+Space) shows that text. Keep one above every bindsym.

##-- Launchers -----------------------------

#: App launcher
bindsym $mod+space exec --no-startup-id rofi -show drun
#: Window switcher
bindsym $mod+Tab exec --no-startup-id rofi -show window
#: This list of keys
bindsym $mod+Shift+space exec --no-startup-id rofi -show keys
#: Clipboard history
bindsym $mod+v exec --no-startup-id CM_LAUNCHER=rofi clipmenu

#: Terminal
bindsym $mod+t exec alacritty
#: Terminal
bindsym $mod+Return exec alacritty
#: Drop-down terminal
bindsym $mod+q exec --no-startup-id ~/.config/i3/scripts/dropdown
#: File manager
bindsym $mod+e exec thunar
#: Browser (focus or start)
bindsym $mod+b exec --no-startup-id ~/.config/i3/scripts/focus-or-launch --browser
#: System monitor (btop)
bindsym $mod+Shift+Escape exec alacritty --class alacritty-float,alacritty-float -e btop --force-utf

##-- Screenshots ---------------------------

#: Screenshot an area (capture)
bindsym $mod+c exec --no-startup-id flameshot gui
#: Screenshot an area
bindsym Print exec --no-startup-id flameshot gui
#: Screenshot the whole screen
bindsym Shift+Print exec --no-startup-id flameshot full --clipboard --path ~/Pictures/Screenshots && ~/.config/i3/scripts/sound screenshot

##-- Session -------------------------------

#: Lock the screen
bindsym $mod+Shift+x exec --no-startup-id ~/.config/i3/scripts/lock-now
#: Session menu (power, reload, restart)
bindsym $mod+Shift+e exec --no-startup-id ~/.config/i3/scripts/powermenu
#: Pomodoro: start, pause, resume
bindsym $mod+Shift+z exec --no-startup-id ~/.config/polybar/scripts/pomo toggle
#: Theme picker
bindsym $mod+Shift+t exec --no-startup-id ~/.config/i3/scripts/theme
#: Show window class (for rules)
bindsym $mod+Shift+i exec --no-startup-id ~/.config/i3/scripts/winclass

##-- Volume and brightness, one step -------

#: Volume up
bindsym $mod+Ctrl+w exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && ~/.config/i3/scripts/sound volume
#: Volume down
bindsym $mod+Ctrl+s exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && ~/.config/i3/scripts/sound volume
#: Mute
bindsym $mod+Ctrl+x exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
#: Brightness up
bindsym $mod+Ctrl+d exec --no-startup-id ~/.config/polybar/scripts/brightness up
#: Brightness down
bindsym $mod+Ctrl+a exec --no-startup-id ~/.config/polybar/scripts/brightness down

##-- Adjust mode ---------------------------

## Everything a 60% keyboard has no key for. Nothing is held down inside it.
#: Adjust: volume, brightness, media
bindsym $mod+g mode "adjust"

mode "adjust" {
        #: Volume up
        bindsym w exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && ~/.config/i3/scripts/sound volume
        #: Volume down
        bindsym s exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && ~/.config/i3/scripts/sound volume
        #: Mute
        bindsym x exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
        #: Brightness up
        bindsym d exec --no-startup-id ~/.config/polybar/scripts/brightness up
        #: Brightness down
        bindsym a exec --no-startup-id ~/.config/polybar/scripts/brightness down
        #: Previous track
        bindsym q exec --no-startup-id playerctl previous
        #: Next track
        bindsym e exec --no-startup-id playerctl next
        #: Play / pause
        bindsym space exec --no-startup-id playerctl play-pause
        #: Event sounds on / off
        bindsym z exec --no-startup-id ~/.config/i3/scripts/sound toggle

        #: Leave adjust mode
        bindsym Escape mode "default"
        #: Leave adjust mode
        bindsym g mode "default"
        #: Leave adjust mode
        bindsym Return mode "default"
}

##-- Media keys (full-size keyboards) ------

#: Volume up
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5% && ~/.config/i3/scripts/sound volume
#: Volume down
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5% && ~/.config/i3/scripts/sound volume
#: Mute
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
#: Mute the microphone
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle
#: Play / pause
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
#: Play / pause
bindsym XF86AudioPause exec --no-startup-id playerctl play-pause
#: Next track
bindsym XF86AudioNext exec --no-startup-id playerctl next
#: Previous track
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
#: Stop playback
bindsym XF86AudioStop exec --no-startup-id playerctl stop
#: Brightness up
bindsym XF86MonBrightnessUp exec --no-startup-id ~/.config/polybar/scripts/brightness up
#: Brightness down
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.config/polybar/scripts/brightness down

##-- Game mode -----------------------------

## Compositor, notifications and idle lock off; i3 keys off except these
#: Game mode on
bindsym $mod+Shift+g exec --no-startup-id ~/.config/i3/scripts/gamemode on

mode "game" {
        #: Game mode off
        bindsym $mod+Shift+g exec --no-startup-id ~/.config/i3/scripts/gamemode off
        #: Workspace 1
        bindsym $mod+1 workspace number 1
        #: Workspace 2
        bindsym $mod+2 workspace number 2
        #: Workspace 3
        bindsym $mod+3 workspace number 3
        #: Workspace 4
        bindsym $mod+4 workspace number 4
        #: Workspace 5
        bindsym $mod+5 workspace number 5
        #: Workspace 6
        bindsym $mod+6 workspace number 6
        #: Workspace 7
        bindsym $mod+7 workspace number 7
        #: Workspace 8
        bindsym $mod+8 workspace number 8
        #: Workspace 9
        bindsym $mod+9 workspace number 9
        #: Workspace 10
        bindsym $mod+0 workspace number 10
}

##-- Pomodoro break ------------------------

## i3/scripts/break-screen puts i3 in this mode; the only live key skips the break
mode "break" {
        #: Skip the break
        bindsym $mod+Ctrl+Shift+b exec --no-startup-id ~/.config/polybar/scripts/pomo skip
}
