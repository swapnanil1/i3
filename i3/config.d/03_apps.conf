## Apps and hardware keys

##-- Launchers -----------------------------

bindsym $mod+d exec --no-startup-id rofi -show drun
bindsym $mod+Tab exec --no-startup-id rofi -show window
bindsym $mod+p exec --no-startup-id CM_LAUNCHER=rofi clipmenu

bindsym $mod+Return exec alacritty
bindsym $mod+Shift+Return exec alacritty --class alacritty-float,alacritty-float
bindsym $mod+Shift+Escape exec alacritty --class alacritty-float,alacritty-float -e btop --force-utf
bindsym $mod+e exec thunar

# Browser: jump to it if one is open, else start the default browser
bindsym $mod+b exec --no-startup-id ~/.config/i3/scripts/focus-or-launch --browser
bindsym $mod+c exec --no-startup-id ~/.config/i3/scripts/focus-or-launch --browser

# Drop-down terminal
bindsym $mod+grave exec --no-startup-id ~/.config/i3/scripts/dropdown

# Show the focused window's class (for 02_rules.conf)
bindsym $mod+Shift+i exec --no-startup-id ~/.config/i3/scripts/winclass

##-- Screenshots ---------------------------

bindsym Print exec --no-startup-id flameshot gui
bindsym $mod+Shift+p exec --no-startup-id flameshot gui
bindsym Shift+Print exec --no-startup-id flameshot full --clipboard --path ~/Pictures/Screenshots

##-- Session -------------------------------

# Game mode: compositor, notifications and idle lock off, i3 keys disabled
bindsym $mod+Shift+g exec --no-startup-id ~/.config/i3/scripts/gamemode on

mode "game" {
        bindsym $mod+Shift+g exec --no-startup-id ~/.config/i3/scripts/gamemode off

        # Alt belongs to the game here; Super+number still switches workspace
        bindsym Mod4+1 workspace number 1
        bindsym Mod4+2 workspace number 2
        bindsym Mod4+3 workspace number 3
        bindsym Mod4+4 workspace number 4
        bindsym Mod4+5 workspace number 5
        bindsym Mod4+6 workspace number 6
        bindsym Mod4+7 workspace number 7
        bindsym Mod4+8 workspace number 8
        bindsym Mod4+9 workspace number 9
        bindsym Mod4+0 workspace number 10
}

bindsym $mod+Shift+x exec --no-startup-id loginctl lock-session
bindsym $mod+Shift+e exec --no-startup-id ~/.config/i3/scripts/powermenu
bindsym $mod+Shift+z exec --no-startup-id ~/.config/polybar/scripts/pomo.sh toggle

##-- Brightness ----------------------------

bindsym $mod+Page_Up exec --no-startup-id ~/.config/polybar/scripts/brightness.sh up
bindsym $mod+Page_Down exec --no-startup-id ~/.config/polybar/scripts/brightness.sh down
bindsym XF86MonBrightnessUp exec --no-startup-id ~/.config/polybar/scripts/brightness.sh up
bindsym XF86MonBrightnessDown exec --no-startup-id ~/.config/polybar/scripts/brightness.sh down

##-- Audio and media -----------------------

bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle

bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioPause exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
bindsym XF86AudioStop exec --no-startup-id playerctl stop
