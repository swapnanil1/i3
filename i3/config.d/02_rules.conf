## Rules
## Match on class (Mod+Shift+I shows the focused window's). Patterns are
## case-insensitive so native, Flatpak and renamed builds all match.

##-- Workspace Rules ------------------------

assign [class="(?i)brave|firefox|chromium|librewolf|zen"] 1
assign [class="(?i)^code|vscodium|antigravity|jetbrains|^zed"] 2
assign [class="^steam_app_|(?i)lutris|heroic|gamescope"] 5
assign [class="(?i)^steam$"] 6
## pavucontrol is not here on purpose: the bar opens it, so it floats where you are
assign [class="(?i)nwg-look|qt6ct|Kvantum Manager"] 8

## These set their class after the window maps (Spotify) or restore late, so
## `assign` would miss them; for_window re-checks when the class changes.
for_window [class="(?i)discord|vesktop|spotify|^obs$"] move to workspace 7

##-- Window Rules ---------------------------

for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [class="alacritty-float|Music"] floating enable
for_window [class="Onboard|Yad"] floating enable
for_window [class="(?i)nwg-look|qt6ct|Kvantum Manager"] floating enable
for_window [class="(?i)pavucontrol|Nm-connection-editor"] floating enable
for_window [class="feh|Ristretto|Gimp|mpv"] floating enable
for_window [class="Xarchiver|flameshot"] floating enable
for_window [class="(?i)gsimplecal"] floating enable, border none

## Drop-down terminal lives on the scratchpad
for_window [instance="dropdown"] floating enable, resize set 1400 700, move scratchpad, sticky enable

##-- Games ----------------------------------

## Games get no border; every Steam window except the main one floats
for_window [class="^steam_app_|(?i)gamescope"] border none
for_window [class="(?i)^steam$" title="^(?!Steam$).+"] floating enable

##-- Pomodoro break ---------------------------

for_window [class="break-screen"] fullscreen enable global, border none
