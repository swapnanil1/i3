# picom 13: GLX backend with vsync, blur and shadows, fullscreen windows unredirected.
# Syntax reference: man picom, section WINDOW RULES.

# --- Backend ---------------------------------------------------------------

backend = "glx";
vsync = true;
use-damage = true;

# Fullscreen windows (games, video) bypass the compositor. FreeSync on X11
# needs a fullscreen window that is not composited, so without this a running
# picom would block it. FreeSync itself works with no compositor at all.
unredir-if-possible = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

log-level = "warn";

# --- Shadows ---------------------------------------------------------------

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;

# --- Fading ----------------------------------------------------------------

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
no-fading-destroyed-argb = true;

# --- Corners ---------------------------------------------------------------

corner-radius = 0;

# --- Blur (behind translucent windows such as Alacritty at 0.9 opacity) ------

blur:
{
	method = "dual_kawase";
	strength = 5;
};

# --- Per-window rules ------------------------------------------------------

rules: ({
	match = "window_type = 'tooltip'";
	fade = true;
	shadow = true;
	opacity = 0.95;
	full-shadow = false;
}, {
	match = "window_type = 'dock'";
	shadow = true;
	clip-shadow-above = true;
	blur-background = false;
}, {
	match = "window_type = 'desktop' || "
	        "window_type = 'utility' || "
	        "_GTK_FRAME_EXTENTS@";
	shadow = false;
	blur-background = false;
}, {
	match = "window_type = 'popup_menu' || "
	        "window_type = 'dropdown_menu'";
	opacity = 1.0;
	blur-background = false;
}, {
	# screenshot selection overlays must stay crisp and instant
	match = "class_g = 'slop' || class_g = 'flameshot'";
	fade = false;
	shadow = false;
	blur-background = false;
}, {
	match = "name = 'Notification' || "
	        "_NET_WM_STATE@[*] = '_NET_WM_STATE_HIDDEN'";
	shadow = false;
})
