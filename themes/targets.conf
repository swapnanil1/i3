# template | written to (relative to the repo) | reload command (optional)
#
# To theme another tool: add a template with ${BG}-style placeholders in
# templates/, add a line here, and make that tool's config import the target.
env            | i3/theme.env                  | ~/.config/i3/scripts/wallpaper
i3.conf        | i3/config.d/00_colors.conf    | i3-msg -q reload
polybar.ini    | polybar/colors.ini            | setsid -f ~/.config/i3/scripts/bar
rofi.rasi      | rofi/shared/colors.rasi       |
alacritty.toml | alacritty/colors.toml         | touch -c ~/.config/alacritty/alacritty.toml
dunst.conf     | dunst/dunstrc.d/colors.conf   | dunstctl reload
fastfetch.jsonc | fastfetch/config.jsonc        |
